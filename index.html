<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geetansh Bansal - Portfolio</title>
<style>
/* === Modern CSS Reset === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* === Global Styles === */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f8f9fa;
  color: #333;
  line-height: 1.6;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 0;
}

section {
  margin-bottom: 3rem;
}

h1, h2, h3 {
  color: #2c3e50;
}

h2 {
  font-size: 1.8rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.5rem;
  border-bottom: 3px solid #3498db;
  display: inline-block;
}

/* === Header Styles === */
header {
  background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
  color: white;
  padding: 3rem 0;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.header-content {
  position: relative;
  z-index: 2;
}

header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 L100,0 L100,100 Z" fill="rgba(255,255,255,0.05)"/></svg>');
  background-size: cover;
}

.profile-img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  margin: 0 auto 1.5rem;
  border: 5px solid rgba(255, 255, 255, 0.3);
  background: #ecf0f1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.profile-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

header h1 {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
  color: white;
}

header .subtitle {
  font-size: 1.2rem;
  margin-bottom: 1.5rem;
  opacity: 0.9;
}

.contact-info {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 1rem;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.contact-item a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: opacity 0.3s ease;
}

.contact-item a:hover {
  opacity: 0.8;
}

/* === About Section === */
.about-content {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2rem;
}

.about-paragraph {
  background: white;
  padding: 1.5rem;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  line-height: 1.7;
}

/* === Interests Section === */
.interests-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.5rem;
}

.interest-card {
  background: white;
  padding: 1.5rem;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  text-align: center;
  transition: transform 0.3s ease;
}

.interest-card:hover {
  transform: translateY(-5px);
}

.interest-icon {
  font-size: 2rem;
  margin-bottom: 1rem;
  color: #3498db;
}

/* === Education Section === */
.education-timeline {
  position: relative;
  max-width: 800px;
  margin: 0 auto;
}

.education-timeline::before {
  content: '';
  position: absolute;
  left: 30px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #3498db;
}

.education-item {
  display: flex;
  margin-bottom: 2rem;
  position: relative;
}

.education-icon {
  width: 60px;
  height: 60px;
  background: #3498db;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1.5rem;
  margin-right: 2rem;
  flex-shrink: 0;
  z-index: 2;
}

.education-content {
  background: white;
  padding: 1.5rem;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  flex: 1;
}

.education-content h3 {
  margin-bottom: 0.5rem;
}

.education-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.5rem;
  color: #7f8c8d;
  font-size: 0.9rem;
}

/* === Projects Section === */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 2rem;
}

.project-card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  transition: transform 0.3s ease;
}

.project-card:hover {
  transform: translateY(-5px);
}

.project-header {
  background: #3498db;
  color: white;
  padding: 1rem 1.5rem;
}

.project-header h3 {
  color: white;
  margin-bottom: 0.3rem;
}

.project-meta {
  font-size: 0.9rem;
  opacity: 0.9;
}

.project-content {
  padding: 1.5rem;
}

.project-content p {
  margin-bottom: 1rem;
}

.project-link {
  display: inline-block;
  margin-top: 1rem;
  color: #3498db;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s ease;
}

.project-link:hover {
  color: #2980b9;
}

.tech-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 1rem;
}

.tech-tag {
  background: #ecf0f1;
  padding: 0.3rem 0.8rem;
  border-radius: 20px;
  font-size: 0.8rem;
  color: #2c3e50;
}

/* === Achievements Section === */
.achievements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
}

.achievement-card {
  background: white;
  padding: 1.5rem;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.achievement-icon {
  color: #e74c3c;
  font-size: 1.5rem;
  flex-shrink: 0;
}

/* === Footer === */
footer {
  background: #2c3e50;
  color: white;
  text-align: center;
  padding: 2rem 0;
  margin-top: 3rem;
}

/* === Responsive Design === */
@media (max-width: 768px) {
  .contact-info {
    flex-direction: column;
    gap: 0.5rem;
  }
  
  .education-timeline::before {
    left: 25px;
  }
  
  .education-icon {
    width: 50px;
    height: 50px;
    margin-right: 1.5rem;
  }
  
  .projects-grid {
    grid-template-columns: 1fr;
  }
  
  .education-meta {
    flex-direction: column;
    gap: 0.3rem;
  }
}

@media (max-width: 480px) {
  header h1 {
    font-size: 2rem;
  }
  
  .profile-img {
    width: 120px;
    height: 120px;
  }
  
  h2 {
    font-size: 1.5rem;
  }
}
</style>

<script>
// Simple script for animations
document.addEventListener('DOMContentLoaded', function() {
  const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = 1;
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, observerOptions);

  const sections = document.querySelectorAll('section');
  sections.forEach(section => {
    section.style.opacity = 0;
    section.style.transform = 'translateY(20px)';
    section.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
    observer.observe(section);
  });
});
</script>
